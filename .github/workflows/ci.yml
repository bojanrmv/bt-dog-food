# Build, lint and test dog-food on Linux and Windows, then let dog-food check
# itself: the whole repo on every push, and only the changed code on pull requests.
# Actions are named by commit; the comment gives the version that commit is.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The first dotnet command on a runner sets the SDK up (NuGet migrations)
      # under a named lock; the tests start several dotnet processes at once,
      # which on Linux race for it. One command first finishes the setup.
      - run: dotnet nuget list source
      - run: cargo test

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # dgf changes needs the base branch history
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install --path crates/dog-food-cli --locked

      # Every report is written before the step fails, so code scanning always
      # gets this commit's results: an alert closes once its function is fixed.
      # Code scanning holds only functions above the fail limit; warnings are in
      # the summary and the HTML report.
      - name: Whole repository (fails above the limits in dgf.toml)
        run: |
          status=0
          dgf analyze --format sarif -o dgf-all.sarif || status=$?
          jq '.runs[].results |= map(select(.level == "error"))' dgf-all.sarif > dgf.sarif
          dgf analyze --format html -o dgf-report.html || true
          dgf analyze --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          exit $status

      - name: Only what this pull request changed
        if: github.event_name == 'pull_request'
        run: |
          dgf changes --base "origin/${{ github.base_ref }}" --format markdown >> "$GITHUB_STEP_SUMMARY"
          dgf changes --base "origin/${{ github.base_ref }}" --format html -o dgf-changes.html

      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always()
        with:
          sarif_file: dgf.sarif
          category: dog-food

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: complexity-reports
          path: dgf-*.html

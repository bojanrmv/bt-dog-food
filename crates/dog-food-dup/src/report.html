<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duplication report</title>
<style>
:root {
  --bg: #f3f5f9; --surface: #ffffff; --surface-2: #f6f8fb; --ink: #111827; --muted: #586174; --faint: #8b93a3;
  --line: #e0e5ed; --accent: #3b5bdb; --accent-soft: #e8edfd; --ok: #2b9a66; --ok-soft: #e3f4ec;
  --warn: #d48806; --warn-soft: #fcf1d9; --code: #f6f8fb; --hole-l: 42%; --hole-bg-l: 92%;
  --shadow: 0 1px 2px rgba(17, 24, 39, 0.05), 0 4px 16px rgba(17, 24, 39, 0.04);
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f17; --surface: #121823; --surface-2: #171f2d; --ink: #e7ebf3; --muted: #9ba5b8; --faint: #687389;
    --line: #232c3c; --accent: #7c9cff; --accent-soft: #1c2645; --ok: #4cc38a; --ok-soft: #12291f;
    --warn: #f2b544; --warn-soft: #2e2410; --code: #0f141d; --hole-l: 70%; --hole-bg-l: 20%;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f17; --surface: #121823; --surface-2: #171f2d; --ink: #e7ebf3; --muted: #9ba5b8; --faint: #687389;
  --line: #232c3c; --accent: #7c9cff; --accent-soft: #1c2645; --ok: #4cc38a; --ok-soft: #12291f;
  --warn: #f2b544; --warn-soft: #2e2410; --code: #0f141d; --hole-l: 70%; --hole-bg-l: 20%;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 24px; letter-spacing: -0.01em; }
h2 { margin: 32px 0 12px; font-size: 16px; }
.sub { color: var(--muted); margin-top: 4px; }
button.theme { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
.number { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
.number b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.number span { color: var(--muted); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.files { padding: 8px 16px; }
.file { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) 70px; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
.file:first-child { border-top: 0; }
.file:hover .name, .file.on .name { color: var(--accent); }
.file .name { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.file .count { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.strip { position: relative; height: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; }
.mark { position: absolute; top: -1px; bottom: -1px; min-width: 3px; border-radius: 2px; opacity: 0.9; cursor: pointer; }
.mark:hover, .mark.on { opacity: 1; outline: 2px solid var(--ink); z-index: 1; }
.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
.tools input[type=search] { flex: 1; min-width: 220px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
.tools label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
.clear { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; }
.class { margin-top: 14px; overflow: hidden; }
.class > .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.class .title { font-weight: 600; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.badge.saves { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.changed { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.body > div { padding: 12px 16px; min-width: 0; }
.body > div + div { border-left: 1px solid var(--line); }
.label { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin: 4px 0 6px; }
.copies { list-style: none; margin: 0 0 8px; padding: 0; }
.copies li { padding: 4px 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.copies li > * { min-width: 0; }
.copies .where { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.copies .fn { color: var(--muted); }
pre { margin: 0; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; font: 12px/1.55 var(--mono); max-height: 420px; }
.hole { border-radius: 4px; padding: 0 3px; font-weight: 600; }
table.holes { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
table.holes td, table.holes th { text-align: left; padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top; }
table.holes th { color: var(--faint); font-weight: 500; }
table.holes code { font-family: var(--mono); }
.unite { margin: 10px 0 0; padding: 10px 12px; background: var(--accent-soft); border-radius: 8px; }
.caution { margin: 8px 0 0; padding: 8px 12px; background: var(--warn-soft); color: var(--ink); border-radius: 8px; font-size: 13px; }
.empty { padding: 32px; text-align: center; color: var(--muted); }
@media (max-width: 760px) {
  .body { grid-template-columns: 1fr; }
  .body > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .file { grid-template-columns: 1fr; gap: 4px; }
  .file .count { text-align: left; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Duplication</h1>
      <div class="sub" id="scope"></div>
    </div>
    <button class="theme" id="theme" type="button">Theme</button>
  </header>
  <section class="numbers" id="numbers"></section>

  <h2>Where the copies are</h2>
  <div class="card files" id="files"></div>

  <h2>Copies and how to unite them</h2>
  <div class="tools">
    <input type="search" id="search" placeholder="Filter by file, function or code">
    <label><input type="checkbox" id="changed"> only changed</label>
    <button class="clear" id="clear" type="button" hidden>show all</button>
  </div>
  <div id="classes"></div>
</main>
<script>
const DATA = /*DATA*/;

const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k === "style") node.style.cssText = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
};
const color = (i) => `hsl(${(i * 137.5) % 360} 62% 50%)`;
const holeColor = (n) => `color: hsl(${(n * 83 + 200) % 360} 70% var(--hole-l)); background: hsl(${(n * 83 + 200) % 360} 70% var(--hole-bg-l));`;
const classes = DATA.classes.map((c, i) => ({ ...c, id: i + 1, color: color(i) }));
const kindWord = { value: "value", name: "variable", member: "member", call: "call", type: "type", local: "local (renamed only)" };
const FILES_SHOWN = 20;
let fileFilter = null;
let classFilter = null;

// Numbers.
const saves = classes.reduce((sum, c) => sum + Math.max(c.saves, 0), 0);
const pct = DATA.lines ? (DATA.duplicatedLines * 100 / DATA.lines).toFixed(1) : "0.0";
document.getElementById("scope").textContent = DATA.scope || `${DATA.files} files scanned`;
for (const [value, label] of [
  [classes.length, "groups of copies"],
  [DATA.duplicatedLines, `duplicated lines (${pct}%)`],
  [saves, "lines a refactor would save"],
  [DATA.files, "files scanned"],
]) {
  document.getElementById("numbers").append(el("div", { class: "number" }, el("b", { text: String(value) }), el("span", { text: label })));
}

// Files, drawn to scale, each copy a mark in its group's color.
const byFile = new Map();
for (const c of classes) for (const copy of c.copies) {
  if (!byFile.has(copy.file)) byFile.set(copy.file, []);
  byFile.get(copy.file).push({ c, copy });
}
const files = [...byFile.entries()].sort((a, b) =>
  b[1].reduce((s, x) => s + x.c.lines, 0) - a[1].reduce((s, x) => s + x.c.lines, 0));
const filesBox = document.getElementById("files");
if (!files.length) filesBox.append(el("div", { class: "empty", text: "No copies found." }));
for (const [file, copies] of files) {
  const total = Math.max(DATA.fileLines[file] || 1, ...copies.map((x) => x.copy.endLine));
  const strip = el("div", { class: "strip" });
  for (const { c, copy } of copies) {
    const left = ((copy.startLine - 1) / total) * 100;
    const width = Math.max(((copy.endLine - copy.startLine + 1) / total) * 100, 0.6);
    const mark = el("div", {
      class: "mark",
      style: `left:${left}%;width:${width}%;background:${c.color}`,
      title: `group ${c.id}: lines ${copy.startLine}-${copy.endLine}${copy.function ? " in " + copy.function : ""}`,
      "data-class": String(c.id),
    });
    mark.addEventListener("click", (e) => { e.stopPropagation(); classFilter = c.id; fileFilter = null; render(); });
    strip.append(mark);
  }
  const lines = copies.reduce((s, x) => s + (x.copy.endLine - x.copy.startLine + 1), 0);
  const row = el("div", { class: "file", "data-file": file },
    el("div", { class: "name", title: file, text: file }),
    strip,
    el("div", { class: "count", text: `${lines} lines` }));
  row.addEventListener("click", () => { fileFilter = fileFilter === file ? null : file; classFilter = null; render(); });
  if (filesBox.children.length >= FILES_SHOWN) row.hidden = true;
  filesBox.append(row);
}
if (files.length > FILES_SHOWN) {
  const more = el("button", { class: "clear", type: "button", text: `show all ${files.length} files` });
  more.addEventListener("click", () => {
    for (const row of filesBox.querySelectorAll(".file")) row.hidden = false;
    more.remove();
  });
  filesBox.append(el("div", { style: "padding:8px 0" }, more));
}

// A template with each hole in its own color.
function template(text) {
  const pre = el("pre");
  for (const part of text.split(/(⟨\d+⟩)/)) {
    const hole = part.match(/^⟨(\d+)⟩$/);
    if (hole) pre.append(el("span", { class: "hole", style: holeColor(Number(hole[1])), text: part }));
    else pre.append(part);
  }
  return pre;
}

function card(c) {
  const changed = c.copies.some((x) => x.changed);
  const title = c.kind === "repeated"
    ? `${c.copies.length} statements in a row with one shape`
    : `${c.copies.length} copies of ${c.lines} lines`;
  const head = el("div", { class: "head" },
    el("span", { class: "swatch", style: `background:${c.color}` }),
    el("span", { class: "title", text: `Group ${c.id} · ${title}` }),
    el("span", { class: "badge saves", text: `saves ~${c.saves} lines` }),
    c.kind === "repeated" ? el("span", { class: "badge", text: "repeated" }) : null,
    changed ? el("span", { class: "badge changed", text: "changed on this branch" }) : null);

  const list = el("ul", { class: "copies" });
  const copies = c.kind === "repeated"
    ? [{ ...c.copies[0], endLine: c.copies[c.copies.length - 1].endLine, changed }]
    : c.copies;
  for (const copy of copies) {
    list.append(el("li", {},
      el("span", { class: "where", text: `${copy.file}:${copy.startLine}-${copy.endLine}` }),
      copy.function ? el("span", { class: "fn", text: copy.function }) : null,
      copy.changed ? el("span", { class: "badge changed", text: "changed" }) : null));
  }
  const left = el("div", {}, el("div", { class: "label", text: c.kind === "repeated" ? "Where" : "Copies" }), list,
    el("div", { class: "label", text: "Shared template" }), template(c.template));

  const right = el("div", {});
  const holes = c.holes;
  if (holes.length) {
    right.append(el("div", { class: "label", text: "What differs" }));
    const table = el("table", { class: "holes" });
    table.append(el("tr", {}, el("th", { text: "hole" }), el("th", { text: "kind" }), el("th", { text: "values" })));
    for (const h of holes) {
      table.append(el("tr", {},
        el("td", {}, el("span", { class: "hole", style: holeColor(h.index), text: `⟨${h.index}⟩` })),
        el("td", { text: kindWord[h.kind] || h.kind }),
        el("td", {}, el("code", { text: h.values.join("  |  ") }))));
    }
    right.append(table);
  }
  right.append(el("div", { class: "label", text: "How to unite" }), el("div", { class: "unite", text: c.unite }));
  for (const caution of c.cautions) right.append(el("div", { class: "caution", text: caution }));
  return el("article", { class: "card class", id: `group-${c.id}` }, head, el("div", { class: "body" }, left, right));
}

const search = document.getElementById("search");
const onlyChanged = document.getElementById("changed");
const clear = document.getElementById("clear");
function render() {
  const query = search.value.trim().toLowerCase();
  const box = document.getElementById("classes");
  box.replaceChildren();
  const shown = classes.filter((c) =>
    (!classFilter || c.id === classFilter) &&
    (!fileFilter || c.copies.some((x) => x.file === fileFilter)) &&
    (!onlyChanged.checked || c.copies.some((x) => x.changed)) &&
    (!query || c.template.toLowerCase().includes(query) ||
      c.copies.some((x) => x.file.toLowerCase().includes(query) || (x.function || "").toLowerCase().includes(query))));
  for (const c of shown) box.append(card(c));
  if (!shown.length) box.append(el("div", { class: "card empty", text: "Nothing matches." }));
  clear.hidden = !(classFilter || fileFilter || query || onlyChanged.checked);
  for (const row of document.querySelectorAll(".file")) row.classList.toggle("on", row.dataset.file === fileFilter);
  for (const mark of document.querySelectorAll(".mark")) mark.classList.toggle("on", Number(mark.dataset.class) === classFilter);
}
search.addEventListener("input", render);
onlyChanged.addEventListener("change", render);
clear.addEventListener("click", () => { classFilter = null; fileFilter = null; search.value = ""; onlyChanged.checked = false; render(); });
onlyChanged.parentElement.hidden = !classes.some((c) => c.copies.some((x) => x.changed));

// Theme: follows the system until chosen.
const themeButton = document.getElementById("theme");
let theme = null;
try { theme = localStorage.getItem("dgf-dup-theme"); } catch (e) {}
if (theme) document.documentElement.dataset.theme = theme;
themeButton.addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  theme = dark ? "light" : "dark";
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("dgf-dup-theme", theme); } catch (e) {}
});
render();
</script>
</body>
</html>

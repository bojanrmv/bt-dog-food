<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How dgf scores code</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .key { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .text { font-size: 12.5px; fill: #475569; }
      .step { font-size: 11px; font-weight: 700; fill: #6366f1; letter-spacing: 0.08em; }
      .line { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="300" rx="14" fill="#ffffff"/>

  <rect class="box" x="24" y="70" width="160" height="150" rx="10"/>
  <text class="step" x="40" y="96">1  READ</text>
  <text class="title" x="40" y="120">Source files</text>
  <text class="text" x="40" y="144">C#, TypeScript,</text>
  <text class="text" x="40" y="162">JavaScript, Rust</text>
  <text class="text" x="40" y="186">.gitignore and</text>
  <text class="text" x="40" y="204">excludes honored</text>

  <rect class="box" x="214" y="70" width="170" height="150" rx="10"/>
  <text class="step" x="230" y="96">2  PARSE</text>
  <text class="title" x="230" y="120">Syntax trees</text>
  <text class="text" x="230" y="144">tree-sitter, one file</text>
  <text class="text" x="230" y="162">per CPU core</text>
  <text class="text" x="230" y="186">no build, no compiler</text>

  <rect class="key" x="414" y="70" width="190" height="150" rx="10"/>
  <text class="step" x="430" y="96">3  SCORE</text>
  <text class="title" x="430" y="120">Every function</text>
  <text class="text" x="430" y="144">cyclomatic complexity</text>
  <text class="text" x="430" y="162">cognitive complexity</text>
  <text class="text" x="430" y="180">nesting, lines, parameters</text>
  <text class="text" x="430" y="198">+ coverage → CRAP</text>

  <rect class="box" x="634" y="70" width="140" height="150" rx="10"/>
  <text class="step" x="650" y="96">4  JUDGE</text>
  <text class="title" x="650" y="120">Limits</text>
  <text class="text" x="650" y="144">ok · warn · fail</text>
  <text class="text" x="650" y="162">baseline, overrides</text>
  <text class="text" x="650" y="180">only changed lines</text>
  <text class="text" x="650" y="198">with dgf changes</text>

  <rect class="box" x="804" y="70" width="132" height="150" rx="10"/>
  <text class="step" x="820" y="96">5  REPORT</text>
  <text class="title" x="820" y="120">Output</text>
  <text class="text" x="820" y="144">table · html</text>
  <text class="text" x="820" y="162">json · markdown</text>
  <text class="text" x="820" y="180">sarif · agent</text>
  <text class="text" x="820" y="198">exit code 0 / 1</text>

  <path class="line" d="M184,145 L210,145"/>
  <path class="line" d="M384,145 L410,145"/>
  <path class="line" d="M604,145 L630,145"/>
  <path class="line" d="M774,145 L800,145"/>

  <text class="text" x="24" y="40" style="font-size:14px; fill:#0f172a; font-weight:600">dgf analyze and dgf changes: read only, about 50 ms for this repository</text>
  <text class="text" x="24" y="262">Coverage comes from reports your tests already write (Cobertura, OpenCover, LCOV). dgf never runs tests, except dgf mutate --run,</text>
  <text class="text" x="24" y="280">which builds and tests a copy of the code with mutants switched in.</text>
</svg>

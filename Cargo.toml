[workspace]
resolver = "2"
members = ["crates/dog-food-core", "crates/dog-food-cli", "crates/dog-food-dup"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dog-food-core = { path = "crates/dog-food-core" }
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-c-sharp = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
rayon = "1.10"
toml = "0.8"
tempfile = "3"
quick-xml = "0.37"
